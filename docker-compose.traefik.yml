# Production deployment behind Traefik v3 with automatic HTTPS (Let's Encrypt).
#
#   1. Point DNS for INBOX_HOST at this server and fill in .env (see .env.example).
#   2. docker network create traefik
#   3a. Already running Traefik on the `traefik` network:
#         docker compose -f docker-compose.traefik.yml up -d
#   3b. No Traefik yet? Start the bundled one too:
#         docker compose -f docker-compose.traefik.yml --profile traefik up -d
#
# Variables read from the shell or .env next to this file:
#   INBOX_HOST        public hostname, e.g. inbox.example.com (required)
#   ACME_EMAIL        Let's Encrypt account email (bundled Traefik only)
#   IMAGE_TAG         image tag to deploy (default: latest)
#   TRAEFIK_NETWORK   Docker network Traefik watches (default: traefik)
#   CERT_RESOLVER     Traefik certificate resolver name (default: letsencrypt)

name: whatsapp-cloud-inbox

services:
  inbox:
    image: ghcr.io/angwdev/whatsapp-cloud-inbox:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # OAuth callbacks must use the public URL, not the container address.
      AUTH_URL: https://${INBOX_HOST:?Set INBOX_HOST to the public hostname}
      AUTH_TRUST_HOST: "true"
    networks:
      - traefik
    # No published ports: only Traefik reaches the app.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}

      # HTTP -> HTTPS (only needed if your Traefik does not redirect globally).
      traefik.http.routers.inbox-http.rule: Host(`${INBOX_HOST}`)
      traefik.http.routers.inbox-http.entrypoints: web
      traefik.http.routers.inbox-http.middlewares: inbox-https-redirect
      traefik.http.middlewares.inbox-https-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.inbox-https-redirect.redirectscheme.permanent: "true"

      # HTTPS router.
      traefik.http.routers.inbox.rule: Host(`${INBOX_HOST}`)
      traefik.http.routers.inbox.entrypoints: websecure
      traefik.http.routers.inbox.tls: "true"
      traefik.http.routers.inbox.tls.certresolver: ${CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.inbox.middlewares: inbox-headers,inbox-compress
      traefik.http.routers.inbox.service: inbox

      # Stricter limits for the sign-in endpoints (higher priority than the catch-all router).
      traefik.http.routers.inbox-auth.rule: Host(`${INBOX_HOST}`) && (PathPrefix(`/api/auth`) || Path(`/login`))
      traefik.http.routers.inbox-auth.entrypoints: websecure
      traefik.http.routers.inbox-auth.tls: "true"
      traefik.http.routers.inbox-auth.tls.certresolver: ${CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.inbox-auth.priority: "100"
      traefik.http.routers.inbox-auth.middlewares: inbox-headers,inbox-auth-ratelimit
      traefik.http.routers.inbox-auth.service: inbox
      traefik.http.middlewares.inbox-auth-ratelimit.ratelimit.average: "10"
      traefik.http.middlewares.inbox-auth-ratelimit.ratelimit.period: 1m
      traefik.http.middlewares.inbox-auth-ratelimit.ratelimit.burst: "20"

      # Security headers.
      traefik.http.middlewares.inbox-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.inbox-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.inbox-headers.headers.stsPreload: "true"
      traefik.http.middlewares.inbox-headers.headers.frameDeny: "true"
      traefik.http.middlewares.inbox-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.inbox-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.inbox-headers.headers.permissionsPolicy: camera=(), microphone=(), geolocation=()

      traefik.http.middlewares.inbox-compress.compress: "true"

      # Backend service with Traefik-side health checking.
      traefik.http.services.inbox.loadbalancer.server.port: "3000"
      traefik.http.services.inbox.loadbalancer.healthcheck.path: /api/health
      traefik.http.services.inbox.loadbalancer.healthcheck.interval: 30s

      # Optional examples — uncomment and add the middleware to a router's `middlewares` list.
      # Restrict to office/VPN ranges:
      #   traefik.http.middlewares.inbox-ipallow.ipallowlist.sourcerange: 203.0.113.0/24,10.0.0.0/8
      # Serve under a path prefix instead of a dedicated host (also set AUTH_URL accordingly):
      #   traefik.http.routers.inbox.rule: Host(`apps.example.com`) && PathPrefix(`/inbox`)
      # Use a wildcard certificate via DNS challenge:
      #   traefik.http.routers.inbox.tls.domains[0].main: example.com
      #   traefik.http.routers.inbox.tls.domains[0].sans: "*.example.com"

  # Bundled Traefik, only started with `--profile traefik`.
  traefik:
    image: traefik:v3.6
    profiles: ["traefik"]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${TRAEFIK_NETWORK:-traefik}
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http3=true
      - --certificatesresolvers.${CERT_RESOLVER:-letsencrypt}.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.${CERT_RESOLVER:-letsencrypt}.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.${CERT_RESOLVER:-letsencrypt}.acme.tlschallenge=true
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true

volumes:
  letsencrypt:
